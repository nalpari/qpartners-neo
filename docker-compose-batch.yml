# feature/batch 브랜치 임시 배포 설정 (development 배포와 병행 운영)
# APP_ENV:   batch (기본값) — .env.batch 사용. DB는 development와 공유 (테스트 용도)
# APP_PORT:  5090 (기본값)
# APP_ROOT:  /home/interplug/qpartners/batch (기본값) — uploads 볼륨 베이스 경로
# IMAGE_TAG: latest (기본값) — Jenkins 빌드 번호로 오버라이드. 이미지 태그는 batch- 접두사가 붙음
#
# 사용법:
#   Jenkins:  IMAGE_TAG=123 APP_PORT=5090 APP_ENV=batch APP_ROOT=/home/interplug/qpartners/batch \
#               docker compose -f docker-compose-batch.yml up -d
#   롤백:     IMAGE_TAG=122 APP_PORT=5090 APP_ENV=batch APP_ROOT=... \
#               docker compose -f docker-compose-batch.yml up -d

services:
  app:
    image: qpartners-neo:batch-${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        PORT: ${APP_PORT:-5090}
    container_name: qpartners-app-batch
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "${APP_PORT:-5090}:${APP_PORT:-5090}"
    env_file: .env.${APP_ENV:-batch}
    environment:
      APP_ENV: ${APP_ENV:-batch}
      UPLOAD_DIR: /data/uploads
    volumes:
      - ${APP_ROOT:-/home/interplug/qpartners/batch}/uploads_data:/data/uploads
