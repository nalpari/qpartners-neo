# feature/batch 브랜치 임시 배포 설정 (development 배포와 병행 운영)
# APP_ENV:   batch (기본값) — env_file 접미사(.env.batch) 로만 사용. DB는 development와 공유 (테스트 용도)
#            컨테이너 런타임 APP_ENV 는 development 로 고정 주입 (아래 environment 주석 참조)
# APP_PORT:  5090 (기본값)
# APP_ROOT:  /home/interplug/qpartners/batch (기본값) — uploads 볼륨 베이스 경로
# IMAGE_TAG: latest (기본값) — Jenkins 빌드 번호로 오버라이드. 이미지 태그는 batch- 접두사가 붙음
#
# 사용법:
#   Jenkins:  IMAGE_TAG=123 APP_PORT=5090 APP_ENV=batch APP_ROOT=/home/interplug/qpartners/batch \
#               docker compose -f docker-compose-batch.yml up -d
#   롤백:     IMAGE_TAG=122 APP_PORT=5090 APP_ENV=batch APP_ROOT=... \
#               docker compose -f docker-compose-batch.yml up -d

services:
  app:
    image: qpartners-neo:batch-${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        PORT: ${APP_PORT:-5090}
    container_name: qpartners-app-batch
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "${APP_PORT:-5090}:${APP_PORT:-5090}"
    env_file: .env.${APP_ENV:-batch}
    environment:
      # 컨테이너에 주입되는 APP_ENV 는 반드시 development — src/lib/config.ts 가 모듈 최상위에서
      # "production" | "development" 만 허용하고 그 외 값에는 throw 하므로, "batch" 를 넘기면
      # config.ts 를 import 하는 모든 route 가 로드 단계에서 죽어 500(text/plain) 이 된다.
      # (compose 의 environment 는 env_file 보다 우선하므로 .env.batch 의 APP_ENV 도 덮어쓴다)
      # 배포 식별자로서의 "batch" 는 env_file 접미사 / 이미지 태그 / APP_ROOT 에만 쓴다.
      APP_ENV: development
      UPLOAD_DIR: /data/uploads
    volumes:
      - ${APP_ROOT:-/home/interplug/qpartners/batch}/uploads_data:/data/uploads
